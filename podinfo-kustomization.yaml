---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: podinfo
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./kustomize
  prune: true
  targetNamespace: default
  sourceRef:
    kind: GitRepository
    name: podinfo
  # The workshop node is nearly full on CPU; shrink podinfo's request so it fits.
  patches:
    - target:
        kind: Deployment
        name: podinfo
      patch: |
        - op: replace
          path: /spec/template/spec/containers/0/resources/requests/cpu
          value: 10m
